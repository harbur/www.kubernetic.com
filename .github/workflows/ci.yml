name: CI

on:
  push:
    branches: [main]
  pull_request:

# The Portal demo package comes from GitHub Packages (.npmrc), which needs a
# token even to read: the job's own, with the package granting this repo access.
permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Static export into out/, plus sitemap.xml and robots.txt.
      - run: bun run build
        env:
          # The preview page's unlisted download links: a secret, which the
          # logs mask, never committed nor a variable: this repo and its
          # Actions logs are public.
          NEXT_PUBLIC_PREVIEW_DOWNLOADS_URL: ${{ secrets.PREVIEW_DOWNLOADS_URL }}
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: out/
          include-hidden-files: true

  deploy:
    needs: build
    # Only main is live; PRs and branches build but never deploy.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: production
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: out/
      - run: bunx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
